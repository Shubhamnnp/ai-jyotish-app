name: Bharat Jyotish CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Zero-Regression Astrological & API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Golden Invariant Regression Tests (< 0.0001 deg, SAV=337)
        run: |
          python -m pytest tests/golden/test_benchmarks_regression.py -v

      - name: Run Enterprise Database Persistence Tests (12,578 Rules)
        run: |
          python -m pytest tests/test_database_persistence.py -v

      - name: Run Inverted Index & Conflict Graph Tests (< 15ms lookup)
        run: |
          python -m pytest tests/test_inverted_index_and_conflict.py -v

      - name: Run 6-Pillar Retrospective Past Event Verification Tests
        run: |
          python -m pytest tests/test_past_event_verification.py -v

      - name: Run Full Enterprise Test Suite (All 72 Tests)
        run: |
          python -m pytest -v

