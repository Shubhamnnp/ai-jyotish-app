[client]
showErrorDetails = true

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true
maxUploadSize = 50
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
