[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    regression: Golden regression benchmarks for legacy astronomical baseline
    reference: Reference validation benchmarks
    golden: Full 100-chart Swiss Ephemeris oracle invariant verification
    fast: Fast PR sanity validation suite (< 15 seconds)
    slow: Slow comprehensive regression suite
    characterization: Characterization snapshot regression suite
